        .flashcard.flipped {

            height: 100%;

            align-items: center;
            width: 100%;
            max-width: 600px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {

            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;

            display: flex;
            align-items: center;
            gap: 8px;

            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-prev:hover, .btn-next:hover {

        .btn-shuffle {

        }

        .btn-shuffle:hover {
            transform: translateY(-2px);

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {

            .flashcard-front h2 {
                font-size: 1.15rem;
            }

            text-align: center;
            color: #475569;
            font-size: 0.75rem;
            margin-top: 10px;
        }

        @media (hover: none) and (pointer: coarse) {
            .swipe-indicator {

            }

    </style>
</head>

        let currentCards = [...flashcardsData];
        let currentIndex = 0;
        let isFlipped = false;
        let touchStartX = 0;
        let touchEndX = 0;

        function getCategoryClass(category) {
            const map = {
                leadership: 'cat-leadership',
                technical: 'cat-technical',
                team: 'cat-team',
                process: 'cat-process',
                dotnet: 'cat-dotnet',
                tips: 'cat-tips'
            };
            return map[category] || 'cat-tips';
        }

        function getCategoryLabel(category) {
            const map = {
                leadership: 'Leadership',
                technical: 'Technical',
                team: 'Team',
                process: 'Process',
                dotnet: '.NET',
                tips: 'Tips & Tricks'
            };
            return map[category] || category;
        }

        function renderCard() {
            const card = currentCards[currentIndex];
            document.getElementById('frontIcon').textContent = card.icon;
            document.getElementById('frontText').textContent = card.question;
            document.getElementById('backContent').innerHTML = card.answer;

            const badge = document.getElementById('frontCategory');
            badge.textContent = getCategoryLabel(card.category);
            badge.className = 'category-badge ' + getCategoryClass(card.category);

            document.getElementById('cardCounter').textContent = `${currentIndex + 1} / ${currentCards.length}`;
            document.getElementById('progressFill').style.width = `${((currentIndex + 1) / currentCards.length) * 100}%`;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === currentCards.length - 1;

            if (isFlipped) {
                document.getElementById('flashcard').classList.remove('flipped');
                isFlipped = false;
            }
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            if (currentIndex < currentCards.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function shuffleCards() {
            for (let i = currentCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
            }
            currentIndex = 0;
            renderCard();
        }

        function filterCards(category) {
            if (category === 'all') {
                currentCards = [...flashcardsData];
            } else {
                currentCards = flashcardsData.filter(card => card.category === category);
            }
            currentIndex = 0;
            renderCard();

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === category);
            });
        }

        // Event Listeners
        document.getElementById('flashcardContainer').addEventListener('click', flipCard);

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => filterCards(btn.dataset.filter));
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            else if (e.key === 'ArrowLeft') prevCard();
            else if (e.key === ' ') { e.preventDefault(); flipCard(); }
            else if (e.key === 's' || e.key === 'S') shuffleCards();
        });

        // Touch/Swipe support
        document.getElementById('flashcardContainer').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.getElementById('flashcardContainer').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextCard();
                else prevCard();
            }
        }, { passive: true });

        // Initialize
        renderCard();
    </script>
